name: Gitleaks SAST scan
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: read-all

jobs:
  gitleaks:
    name: Gitleaks SAST scan
    permissions:
      pull-requests: write
    uses: fish-shop/workflows/.github/workflows/gitleaks.yml@62a6873939a6eb0ebbb314c351db706eb0f600c8 # v1.14.18
    secrets:
      gitleaks_license: ${secrets.GITLEAKS_LICENSE}
