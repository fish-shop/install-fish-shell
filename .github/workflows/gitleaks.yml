name: Gitleaks SAST scan
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: read-all

jobs:
  gitleaks:
    name: Gitleaks SAST scan
    permissions:
      pull-requests: write
    uses: fish-shop/workflows/.github/workflows/gitleaks.yml@8707e7e1e7f8cbce05a84fa71e173ef158f050a8 # v1.14.24
    secrets:
      gitleaks_license: ${secrets.GITLEAKS_LICENSE}
