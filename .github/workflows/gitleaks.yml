name: Gitleaks SAST scan
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: read-all

jobs:
  gitleaks:
    name: Gitleaks SAST scan
    permissions:
      pull-requests: write
    uses: fish-shop/workflows/.github/workflows/gitleaks.yml@29c02606b97ce98c24ebc8cd96ef844c5a41e251 # v1.14.30
    secrets:
      gitleaks_license: ${secrets.GITLEAKS_LICENSE}
