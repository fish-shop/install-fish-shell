name: Gitleaks SAST scan
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: read-all

jobs:
  gitleaks:
    name: Gitleaks SAST scan
    permissions:
      pull-requests: write
    uses: fish-shop/workflows/.github/workflows/gitleaks.yml@889a539f5244ae2ac161bab52ea099ad064e5d5f # v1.14.32
    secrets:
      gitleaks_license: ${secrets.GITLEAKS_LICENSE}
