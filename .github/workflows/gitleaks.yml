name: Gitleaks SAST scan
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: read-all

jobs:
  gitleaks:
    name: Gitleaks SAST scan
    permissions:
      pull-requests: write
    uses: fish-shop/workflows/.github/workflows/gitleaks.yml@df4941955526eb0cbd0ba83e77d64039f98ea38f # v1.14.33
    secrets:
      gitleaks_license: ${secrets.GITLEAKS_LICENSE}
