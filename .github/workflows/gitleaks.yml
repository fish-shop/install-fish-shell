name: Gitleaks SAST scan
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: read-all

jobs:
  gitleaks:
    name: Gitleaks SAST scan
    permissions:
      pull-requests: write
    uses: fish-shop/workflows/.github/workflows/gitleaks.yml@3adb02958763740db4bf7c7dd69b80a0f932b3b3 # v1.14.29
    secrets:
      gitleaks_license: ${secrets.GITLEAKS_LICENSE}
