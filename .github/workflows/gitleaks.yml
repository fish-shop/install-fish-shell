name: Gitleaks SAST scan
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: read-all

jobs:
  gitleaks:
    name: Gitleaks SAST scan
    permissions:
      pull-requests: write
    uses: fish-shop/workflows/.github/workflows/gitleaks.yml@9c642aa903b9f138dce217fd88e9e9743421c042 # v1.14.19
    secrets:
      gitleaks_license: ${secrets.GITLEAKS_LICENSE}
