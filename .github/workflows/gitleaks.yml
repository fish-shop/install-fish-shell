name: Gitleaks SAST scan
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: read-all

jobs:
  gitleaks:
    name: Gitleaks SAST scan
    permissions:
      pull-requests: write
    uses: fish-shop/workflows/.github/workflows/gitleaks.yml@4f4d830f9b2bb040c68cba0557dfdec320e1e758 # v1.14.31
    secrets:
      gitleaks_license: ${secrets.GITLEAKS_LICENSE}
