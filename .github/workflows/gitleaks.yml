name: Gitleaks SAST scan
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: read-all

jobs:
  gitleaks:
    name: Gitleaks SAST scan
    permissions:
      pull-requests: write
    uses: fish-shop/workflows/.github/workflows/gitleaks.yml@879a7e05587ded26699c98c2b5906a7cd8d24f03 # v1.14.35
    secrets:
      gitleaks_license: ${secrets.GITLEAKS_LICENSE}
