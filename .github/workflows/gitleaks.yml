name: Gitleaks SAST scan
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: read-all

jobs:
  gitleaks:
    name: Gitleaks SAST scan
    permissions:
      pull-requests: write
    uses: fish-shop/workflows/.github/workflows/gitleaks.yml@bb57c462d9d13fe7839ee1a3194387789970f874 # v1.14.27
    secrets:
      gitleaks_license: ${secrets.GITLEAKS_LICENSE}
