name: Gitleaks SAST scan
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: read-all

jobs:
  gitleaks:
    name: Gitleaks SAST scan
    permissions:
      pull-requests: write
    uses: fish-shop/workflows/.github/workflows/gitleaks.yml@0098e83197006da1d2a8b9a4ec9eb7c9e766bd6b # v1.14.34
    secrets:
      gitleaks_license: ${secrets.GITLEAKS_LICENSE}
