name: Gitleaks SAST scan
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: read-all

jobs:
  gitleaks:
    name: Gitleaks SAST scan
    permissions:
      pull-requests: write
    uses: fish-shop/workflows/.github/workflows/gitleaks.yml@9ce460dc45b24d21ba41ea70166c791cfb3c26c8 # v1.14.21
    secrets:
      gitleaks_license: ${secrets.GITLEAKS_LICENSE}
