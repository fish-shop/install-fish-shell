name: Gitleaks SAST scan
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: read-all

jobs:
  gitleaks:
    name: Gitleaks SAST scan
    permissions:
      pull-requests: write
    uses: fish-shop/workflows/.github/workflows/gitleaks.yml@b6fc94598a2b55d8d3228112623c006f9df627ae # v1.14.28
    secrets:
      gitleaks_license: ${secrets.GITLEAKS_LICENSE}
