name: Gitleaks SAST scan
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: read-all

jobs:
  gitleaks:
    name: Gitleaks SAST scan
    permissions:
      pull-requests: write
    uses: fish-shop/workflows/.github/workflows/gitleaks.yml@fb066b3ec781068decb35ae9d67044e3fc58e8a3 # v1.14.25
    secrets:
      gitleaks_license: ${secrets.GITLEAKS_LICENSE}
