name: Gitleaks SAST scan
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: read-all

jobs:
  gitleaks:
    name: Gitleaks SAST scan
    permissions:
      pull-requests: write
    uses: fish-shop/workflows/.github/workflows/gitleaks.yml@ac154a774b835fd87b181c3b9bbed9fad946ad39 # v1.14.17
    secrets:
      gitleaks_license: ${secrets.GITLEAKS_LICENSE}
